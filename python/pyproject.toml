[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campelmag"
version = "1.0.0"
description = "Cálculo de campos elétrico e magnético em linhas de transmissão"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Alan Franco Rosa"}
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "ruff>=0.8.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "ruff>=0.8.0",
]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "N", "S", "B", "A", "C4", "DTZ", "PIE", "PT", "RET", "SIM", "ARG", "PL", "FURB"]
ignore = ["S101", "PLR0913", "PLR2004"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
